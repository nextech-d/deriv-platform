name: Docker build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "hooks/**"
      - "workers/**"
      - "public/**"
      - "next.config.ts"
      - ".github/workflows/docker-build.yml"

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NEXT_PUBLIC_DERIV_APP_ID: ${{ secrets.NEXT_PUBLIC_DERIV_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build mode
        id: mode
        run: |
          if [ -n "${AWS_ACCESS_KEY_ID}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "aws_region=${AWS_REGION:-af-south-1}" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=${ECR_REPOSITORY:-deriv-platform}" >> "$GITHUB_OUTPUT"
          echo "app_id=${NEXT_PUBLIC_DERIV_APP_ID:-000000}" >> "$GITHUB_OUTPUT"

      - name: Validate Dockerfile build (no push)
        if: steps.mode.outputs.push != 'true'
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_DEMO_MODE=true \
            --build-arg NEXT_PUBLIC_DERIV_APP_ID=000000 \
            -t deriv-platform:ci .

      - name: Configure AWS credentials
        if: steps.mode.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.mode.outputs.aws_region }}

      - name: Login to Amazon ECR
        if: steps.mode.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        if: steps.mode.outputs.push == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ steps.mode.outputs.ecr_repository }}
          APP_ID: ${{ steps.mode.outputs.app_id }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_DEMO_MODE=false \
            --build-arg NEXT_PUBLIC_DERIV_APP_ID="$APP_ID" \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
