name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Production (tradecity.trade) deploys via Vercel from tradecity-bot/.
  # This job validates the bot build that Vercel runs — not the legacy Next.js app.
  ci:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: "34amx1QiDFzvoe7UQPzAw"
      APP_ID: "34amx1QiDFzvoe7UQPzAw"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run install:bot

      - name: Verify ESLint config loads
        run: npx eslint eslint.config.mjs

      - run: npm run build

  legacy-e2e:
    runs-on: ubuntu-latest
    if: false # Legacy Next.js app — re-enable when e2e is updated for tradecity-bot
    env:
      SESSION_SECRET: e2e-test-session-secret-min-32-chars!!
      ADMIN_SECRET: e2e-test-admin-secret-min-32-chars!!
      NEXT_PUBLIC_DERIV_APP_ID: "000000"
      NEXT_PUBLIC_DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chrome

      - run: npm run test:e2e
        env:
          CI: true
